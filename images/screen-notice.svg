="90" width="62" height="24" rx="12" fill="#fdf4e3"/><text x="929.0" y="106.5" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#a16207">검토 대기</text><text x="236" y="152" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="12" fill="#98a2b3">사람이 확인하기 전에는 발송되지 않습니다</text><rect x="214" y="178" width="762" height="92" rx="8" fill="#fdfdfe" stroke="#eaedf3"/><text x="236" y="206" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#1b2b45">김민수 · 월간 안내</text><text x="236" y="234" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="13.5" fill="#55606f">이번 달 출석률 90%입니다. 결석 2회, 지각 1회입니다.</text><rect x="898" y="194" width="62" height="24" rx="12" fill="#fdf4e3"/><text x="929.0" y="210.5" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#a16207">검토 대기</text><text x="236" y="256" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="12" fill="#98a2b3">사람이 확인하기 전에는 발송되지 않습니다</text><rect x="214" y="282" width="762" height="92" rx="8" fill="#fdfdfe" stroke="#eaedf3"/><text x="236" y="310" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#1b2b45">최지우 · 결석 안내</text><text x="236" y="338" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="13.5" fill="#55606f">본문에 휴대폰 번호가 포함되어 생성이 차단되었습니다.</text><rect x="898" y="298" width="62" height="24" rx="12" fill="#fdeee7"/><text x="929.0" y="314.5" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#c2410c">생성 차단</text><text x="236" y="360" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="12" fill="#98a2b3">사람이 확인하기 전에는 발송되지 않습니다</text></svg>