<text x="26" y="82" fill="#79c0ff" font-family="Consolas,'Cascadia Mono',monospace" font-size="14.5" xml:space="preserve">입력 파일: C:\Users\ildoc\kernfoundry\data\sample_students.csv</text><text x="26" y="105" fill="#79c0ff" font-family="Consolas,'Cascadia Mono',monospace" font-size="14.5" xml:space="preserve">칸 매핑: {&#x27;name&#x27;: &#x27;이름&#x27;, &#x27;attended&#x27;: &#x27;출석&#x27;, &#x27;total&#x27;: &#x27;총수업&#x27;, &#x27;absent&#x27;: &#x27;결석&#x27;, &#x27;late&#x27;: &#x27;지각&#x27;}</text><text x="26" y="128" fill="#e3b341" font-family="Consolas,'Cascadia Mono',monospace" font-size="14.5" xml:space="preserve">  경고: 5행: &#x27;최지우&#x27; 의 출석/총수업을 숫자로 읽지 못했습니다 (출석=&#x27;출석&#x27;, 총수업=&#x27;20&#x27;).</text><text x="26" y="151" fill="#d7dce5" font-family="Consolas,'Cascadia Mono',monospace" font-size="14.5" xml:space="preserve">출석률 계산: 3명</text><text x="26" y="174" fill="#e3b341" font-family="Consolas,'Cascadia Mono',monospace" font-size="14.5" xml:space="preserve">  경고: 박철수: 총수업일수가 0이라 계산 불가 — 수업 데이터를 확인해주세요</text><text x="26" y="197" fill="#e3b341" font-family="Consolas,'Cascadia Mono',monospace" font-size="14.5" xml:space="preserve">  경고: 오류헌터: 출석이 총수업보다 많음 (출석=21.0, 총수업=20.0) — 입력 실수일 수 있습니다</text><text x="26" y="220" fill="#d7dce5" font-family="Consolas,'Cascadia Mono',monospace" font-size="14.5" xml:space="preserve"></text><text x="26" y="243" fill="#d7dce5" font-family="Consolas,'Cascadia Mono',monospace" font-size="14.5" xml:space="preserve">초안 저장: C:\Users\ildoc\kernfoundry\outbox\drafts_20261009.jsonl  (3건)</text><text x="26" y="266" fill="#d7dce5" font-family="Consolas,'Cascadia Mono',monospace" font-size="14.5" xml:space="preserve">  - 김민수  monthly_report  검토대기  [template:v1]</text><text x="26" y="289" fill="#d7dce5" font-family="Consolas,'Cascadia Mono',monospace" font-size="14.5" xml:space="preserve">  - 정다움  monthly_report  검토대기  [template:v1]</text><text x="26" y="312" fill="#d7dce5" font-family="Consolas,'Cascadia Mono',monospace" font-size="14.5