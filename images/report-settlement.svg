<text x="96" y="27" fill="#8b93a1" font-family="'Malgun Gothic',sans-serif" font-size="13">kernfoundry — 수강료 정산 실행</text>
<text x="26" y="82" fill="#79c0ff" font-family="Consolas,'Cascadia Mono',monospace" font-size="14.5" xml:space="preserve">입력 파일: C:\Users\ildoc\kernfoundry\data\sample_tuition.csv</text><text x="26" y="105" fill="#e3b341" font-family="Consolas,'Cascadia Mono',monospace" font-size="14.5" xml:space="preserve">  경고: 6행: &#x27;오류헌터&#x27; 할인(400000.0)이 수강료(300000.0)보다 큽니다. 청구액이 음수가 됩니다 — 확인 필요.</text><text x="26" y="128" fill="#e3b341" font-family="Consolas,'Cascadia Mono',monospace" font-size="14.5" xml:space="preserve">  경고: 7행: &#x27;박철수&#x27; 수강료를 숫자로 읽지 못했습니다 (&#x27;삼십만&#x27;).</text><text x="26" y="151" fill="#79c0ff" font-family="Consolas,'Cascadia Mono',monospace" font-size="14.5" xml:space="preserve">요약: {&#x27;학생수&#x27;: 5, &#x27;청구액합계&#x27;: 1050000.0, &#x27;납부액합계&#x27;: 700000.0, &#x27;미납합계&#x27;: 450000.0, &#x27;미납자&#x27;: [&#x27;한가영&#x27;, &#x27;최지우&#x27;], &#x27;상태별&#x27;: {&#x27;완납&#x27;: 2, &#x27;일부납&#x27;: 1, &#x27;미납&#x27;: 2, &#x27;과납&#x27;: 0}}</text><text x="26" y="174" fill="#d7dce5" font-family="Consolas,'Cascadia Mono',monospace" font-size="14.5" xml:space="preserve"></text><text x="26" y="197" fill="#d7dce5" font-family="Consolas,'Cascadia Mono',monospace" font-size="14.5" xml:space="preserve">미납 알림 초안: C:\Users\ildoc\kernfoundry\outbox\drafts_20261009.jsonl (2건 · 전부 검토대기)</text><text x="26" y="220" fill="#d7dce5" font-family="Consolas,'Cascadia Mono',monospace" font-size="14.5" xml:space="preserve">  - 한가영: 10월 수강료 안내드립니다. 청구 금액은 300,000원, 납부 확인된 금액은 150,000원입니다. 남은 금액은 150,000원입니다.</text><text x="26" y="243" fill="#d7dce5" font-family="Consolas,'Cascadia Mono',monospace" font-size="14.5" xml:space="preserve">  - 최지우: 10월 수강료 안내드립니다. 청구 금액은 300,000원, 납부 확인된 금액은 0원입니다. 남은 금액은 300,000원입니다.</text><text x="26" y="266" fill="#d7dce5" font-family="Consolas,'Cascadia Mono',monospace" font-size="14.5" xml:space="preserve">※ 보내지 않았습니다. 검토 후 발송하세요.</text><text x="26" y="289" fill="#d7dce5" font-family="Consolas,'Cascadia Mono',monospace" font-size="14.5"