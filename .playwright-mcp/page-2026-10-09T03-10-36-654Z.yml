  - generic [ref=f7e33]:
    - generic [ref=f7e34]:
      - generic [ref=f7e35]:
        - generic [ref=f7e36]: Greeting
        - heading "인사말" [level=2] [ref=f7e37]
      - paragraph [ref=f7e38]: Kernfoundry는 학원을 운영하는 사람이 자기 학원의 반복 업무를 줄이려고 직접 만든 프로그램을 제품으로 정리한 곳입니다.
      - paragraph [ref=f7e39]: 매주 같은 일이 반복됩니다. 출결 파일을 모아 출석률을 계산하고, 결석한 학생의 학부모님께 보낼 안내문을 쓰고, 매달 수강료 납부 내역을 확인해 미납자를 추립니다. 사람이 하면 시간이 들고, 엑셀은 값이 하나만 어긋나도 조용히 틀린 숫자를 내놓습니다.
      - paragraph [ref=f7e40]: 그래서 필요한 부분을 직접 도구로 만들었습니다. 계산과 초안은 프로그램이 하고, 사람에게 닿는 판단과 발송은 원장님과 담당자가 합니다. 이상한 값은 넘기지 않고 경고로 남기고, 학부모님께 나가는 안내문은 검토 기록이 있어야 발송할 수 있게 했습니다.
      - paragraph [ref=f7e41]: 같은 일을 반복하는 다른 학원과 공부방에도 도움이 되기를 바랍니다.
